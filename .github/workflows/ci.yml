name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway database for the tests and migrations. CI never touches Neon.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: approvals_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/approvals_test
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/approvals_test
      # Dummy credentials: the tests use a fake Resend, and nothing here is deployed.
      AGENT_API_KEY: ci-agent-key-not-a-secret-00000000000000
      REVIEWER_TOKEN: ci-reviewer-token-not-a-secret-0000000000
      RESEND_API_KEY: re_ci_dummy_never_sent
      # tests/setup.ts refuses to run unless the database is known to be disposable.
      TEST_DB_OK: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
